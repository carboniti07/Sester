name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/assets/**", "brand/sester-mark-v2.svg"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (static + brand assets)
        run: |
          mkdir -p site/assets
          cp .github/assets/og.png site/assets/og.png
          cp .github/assets/avatar.png site/assets/avatar.png
          cp brand/sester-mark-v2.svg site/assets/mark.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
